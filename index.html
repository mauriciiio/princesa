/* .zip simples (sem compressão): dados.json, valores.csv e todos os PDFs e fotos */
const TAB_CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = TAB_CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipar(itens) {
  const enc = new TextEncoder(), partes = [], central = [];
  const d = new Date();
  const hora = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dia = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let pos = 0;
  for (const it of itens) {
    const nome = enc.encode(it.nome), dados = it.dados, crc = crc32(dados);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, hora, true); lh.setUint16(12, dia, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, dados.length, true); lh.setUint32(22, dados.length, true); lh.setUint16(26, nome.length, true); lh.setUint16(28, 0, true);
    partes.push(new Uint8Array(lh.buffer), nome, dados);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, hora, true); ch.setUint16(14, dia, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, dados.length, true); ch.setUint32(24, dados.length, true); ch.setUint16(28, nome.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, pos, true);
    central.push(new Uint8Array(ch.buffer), nome);
    pos += 30 + nome.length + dados.length;
  }
  const tamCentral = central.reduce((n, u) => n + u.length, 0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true); fim.setUint16(4, 0, true); fim.setUint16(6, 0, true);
  fim.setUint16(8, itens.length, true); fim.setUint16(10, itens.length, true);
  fim.setUint32(12, tamCentral, true); fim.setUint32(16, pos, true); fim.setUint16(20, 0, true);
  return new Blob([...partes, ...central, new Uint8Array(fim.buffer)], { type: "application/zip" });
}
/* nomes dentro do .zip (o restaurar repete as mesmas regras) */
function limpaNome(t) { return String(t || "").replace(/[\\/:*?"<>|\u0000-\u001f]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 80) || "arquivo"; }
function nomeLivre(caminho, usados) {
  let c = caminho, n = 2;
  const i = caminho.lastIndexOf("."), barra = caminho.lastIndexOf("/");
  while (usados.has(c.toLowerCase())) { c = i > barra ? caminho.slice(0, i) + " (" + n + ")" + caminho.slice(i) : caminho + " (" + n + ")"; n++; }
  return c;
}
/* arquivos que o backup tenta incluir, na ordem do dados.json */
function tarefasZip(dados) {
  const grupos = [
    ["exames", e => (e.data || "sem data") + " " + (e.titulo || TIPO[e.tipo]?.nome || "Exame")],
    ["vacinas", v => (v.data || "sem data") + " " + (v.vacina || "Vacina")],
    ["remedios", r => (r.inicio || "sem data") + " " + (r.nome || "Remédio")],
  ];
  const tarefas = [];
  for (const [pasta, rot] of grupos) {
    for (const r of (Array.isArray(dados[pasta]) ? dados[pasta] : [])) {
      if (!r || typeof r !== "object") continue;
      for (const a of (Array.isArray(r.arquivos) ? r.arquivos : [])) {
        if (idOk(a?.id)) tarefas.push({ id: a.id, caminho: pasta + "/" + limpaNome(rot(r)) + "/" + limpaNome(nomeComExt(a.nome, a.tipo)), tamanho: a.tamanho });
      }
    }
  }
  if (idOk(dados.ficha?.fotoId)) tarefas.push({ id: dados.ficha.fotoId, caminho: "foto", foto: true });
  return tarefas;
}
/* .zip do backup: dados.json, valores.csv, PDFs e fotos, foto da ficha e arquivos.json (id do arquivo → caminho no .zip) */
async function montarBackupZip(dados, csv, pegar, aviso) {
  const enc = new TextEncoder(), itens = [], usados = new Set(), faltaram = [], manifesto = {};
  const unico = caminho => { const c = nomeLivre(caminho, usados); usados.add(c.toLowerCase()); return c; };
  itens.push({ nome: unico("dados.json"), dados: enc.encode(JSON.stringify(dados, null, 2)) });
  if (csv) itens.push({ nome: unico("valores.csv"), dados: enc.encode(csv) });
  const tarefas = tarefasZip(dados);
  for (const [i, t] of tarefas.entries()) {
    aviso("Juntando arquivos " + (i + 1) + " de " + tarefas.length + "…");
    try {
      const b = await pegar(t.id);
      const u8 = new Uint8Array(await b.arrayBuffer());
      const caminho = t.foto ? nomeComExt("foto", String(b.type || "").split(";")[0].trim()) : t.caminho;
      const nome = unico(caminho);
      itens.push({ nome, dados: u8 });
      manifesto[t.foto ? "foto" : t.id] = nome;
    } catch (e) { faltaram.push(t.caminho); }
  }
  itens.push({ nome: unico("arquivos.json"), dados: enc.encode(JSON.stringify(manifesto, null, 2)) });
  if (faltaram.length) itens.push({ nome: unico("arquivos-que-faltaram.txt"), dados: enc.encode("Estes arquivos não puderam ser incluídos:\r\n" + faltaram.join("\r\n")) });
  aviso("Gerando o .zip…");
  return { blob: zipar(itens), faltaram: faltaram.length };
}

function csvValores() {

  const linhas = [["Data", "Exame", "Tipo", "Analito", "Valor", "Unidade", "Ref. mínima", "Ref. máxima", "Situação", "Clínica", "Veterinário(a)"].join(";")];
  for (const e of D().exames) for (const v of (e.valores || [])) {
    if (!v || !v.nome) continue;
    linhas.push([fmtData(e.data), e.titulo || "", TIPO[e.tipo]?.nome || "", v.nome, ehNum(v.valor) ? nb(v.valor) : (v.texto || ""), v.unidade || "", nb(num(v.refMin)), nb(num(v.refMax)), SIT[statusOf(v)] || "", e.clinica || "", e.veterinario || ""].map(q).join(";"));
  }
  for (const w of S.pesos.slice().sort((a, b) => String(b.data || "").localeCompare(String(a.data || "")))) {

const COLS_BACKUP = ["exames", "vacinas", "remedios", "lembretes", "pesos"];

/* leitor de .zip pelo diretório central: nomes UTF-8, sem compressão (0) ou deflate (8) */
async function lerZip(blob) {
  const tam = blob.size;
  if (tam < 22) throw { code: "zip" };
  const cauda = new Uint8Array(await blob.slice(Math.max(0, tam - 65557)).arrayBuffer());
  let p = -1;
  for (let i = cauda.length - 22; i >= 0; i--) {
    if (cauda[i] === 0x50 && cauda[i + 1] === 0x4b && cauda[i + 2] === 0x05 && cauda[i + 3] === 0x06) { p = i; break; }
  }
  if (p < 0) throw { code: "zip" };
  const fim = new DataView(cauda.buffer, cauda.byteOffset + p, 22);
  const total = fim.getUint16(10, true), tamCd = fim.getUint32(12, true), iniCd = fim.getUint32(16, true);
  if (total === 0xFFFF || tamCd === 0xFFFFFFFF || iniCd === 0xFFFFFFFF) throw { code: "zip" };
  if (iniCd + tamCd > tam) throw { code: "zip" };
  const cd = new Uint8Array(await blob.slice(iniCd, iniCd + tamCd).arrayBuffer());
  const dv = new DataView(cd.buffer, cd.byteOffset, cd.byteLength);
  const dec = new TextDecoder("utf-8");
  const entradas = [];
  let o = 0;
  for (let k = 0; k < total; k++) {
    if (o + 46 > cd.length || dv.getUint32(o, true) !== 0x02014b50) throw { code: "zip" };
    const flags = dv.getUint16(o + 8, true), metodo = dv.getUint16(o + 10, true), crc = dv.getUint32(o + 16, true);
    const comprimido = dv.getUint32(o + 20, true), tamanho = dv.getUint32(o + 24, true);
    const nn = dv.getUint16(o + 28, true), ne = dv.getUint16(o + 30, true), nc = dv.getUint16(o + 32, true);
    const local = dv.getUint32(o + 42, true);
    const nome = dec.decode(cd.subarray(o + 46, o + 46 + nn)).replace(/\\/g, "/");
    o += 46 + nn + ne + nc;
    if (!nome || nome.endsWith("/")) continue;
    entradas.push({ nome, metodo, crc, comprimido, tamanho, local, cifrado: !!(flags & 1) });
  }
  return entradas;
}
async function extrairZip(blob, e) {
  if (!e) throw { code: "zip" };
  if (e.cifrado || (e.metodo !== 0 && e.metodo !== 8)) throw { code: "zip_metodo" };
  const lh = new DataView(await blob.slice(e.local, e.local + 30).arrayBuffer());
  if (lh.byteLength < 30 || lh.getUint32(0, true) !== 0x04034b50) throw { code: "zip" };
  const ini = e.local + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
  const parte = blob.slice(ini, ini + e.comprimido);
  let u8;
  if (e.metodo === 0) u8 = new Uint8Array(await parte.arrayBuffer());
  else {
    if (typeof DecompressionStream !== "function") throw { code: "zip_deflate" };
    try { u8 = new Uint8Array(await new Response(parte.stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()); }
    catch (x) { throw { code: "zip_crc" }; }
  }
  if (u8.length !== e.tamanho || crc32(u8) !== e.crc) throw { code: "zip_crc" };
  return u8;
}

async function abrirBackup(arq) {

  if (!(cab[0] === 0x50 && cab[1] === 0x4b && cab[2] === 0x03 && cab[3] === 0x04)) {

/* o que vai ser gravado: pula o registro que já está aqui igual ou mais novo (mesmo id) */
function planoRestauracao(dados, mapa, locais) {
  const idDoc = s => typeof s === "string" && /^[A-Za-z0-9_-]{1,128}$/.test(s);
  const jaTem = (local, r) => !!local && !!local.atualizadoEm && String(local.atualizadoEm) >= String(r.atualizadoEm || "");
  const itens = [], cont = {}, faltando = new Set();
  let pulados = 0, substituidos = 0, ficha = null, foto = null;
  for (const col of COLS_BACKUP) {
    cont[col] = 0;
    for (const r of (Array.isArray(dados[col]) ? dados[col] : [])) {
      if (!r || typeof r !== "object" || Array.isArray(r)) continue;
      const id = idDoc(r.id) ? r.id : null;
      const local = id ? (locais[col] || []).find(x => x.id === id) || null : null;
      if (jaTem(local, r)) { pulados++; continue; }
      if (local) substituidos++;
      const doc = Object.assign({}, r);
      delete doc.id;
      itens.push({ col, id, doc, local, fonte: r });
      cont[col]++;
    }

      delete doc.id;

      if (locais.pet) substituidos++;

    }
  }
  const arquivos = new Set();
  for (const it of itens) for (const a of (Array.isArray(it.doc.arquivos) ? it.doc.arquivos : [])) {

/* tipo pelo começo do arquivo, quando o nome não diz */
function tipoPorBytes(u8) {

  if (b(0) === 0xFF && b(1) === 0xD8 && b(2) === 0xFF) return "image/jpeg";
  if (b(0) === 0x89 && b(1) === 0x50 && b(2) === 0x4E && b(3) === 0x47) return "image/png";
  if (b(0) === 0x47 && b(1) === 0x49 && b(2) === 0x46) return "image/gif";
  if (b(0) === 0x52 && b(1) === 0x49 && b(2) === 0x46 && b(3) === 0x46 && b(8) === 0x57 && b(9) === 0x45 && b(10) === 0x42 && b(11) === 0x50) return "image/webp";

async function executarRestauracao(plano, backup, aviso, ctx) {

    if (falhou.has(chave)) return null;
    if (!CAP.assets) { falhou.add(chave); return null; }
    aviso("Enviando arquivo " + vistos.size + " de " + plano.nArquivos + "…");
    let n = null;

      const u8 = await backup.ler(caminho);
      const tipo = (TIPOS_OK.includes(tipoDado) ? tipoDado : null) || adivinharTipo({ type: "", name: caminho }) || tipoPorBytes(u8);
      if (!tipo) throw { code: "unsupported_type" };

<script>

        });
      });
      // o app fica aberto por dias: procura versão nova ao voltar para ele
      var ultima = Date.now();
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible" || Date.now() - ultima < 60000) return;
        ultima = Date.now();
        reg.update().catch(function () {});
      });
    }).catch(function (e) { console.warn("Service worker não registrado:", e); });
  });
})();
</script>
</body>
</html>
